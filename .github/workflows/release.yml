name: Verify and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify source and debug build
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          git diff --check
          ./gradlew :app:assembleDebug :app:lintDebug --stacktrace --console=plain

  signed-release:
    name: Build and publish formally signed release APK
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore formal release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/official.keystore"
          test -s "$RUNNER_TEMP/official.keystore"
          chmod 600 "$RUNNER_TEMP/official.keystore"

      - name: Build formally signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/official.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:checkReleaseSigning :app:signRelease --stacktrace --console=plain

      - name: Verify signature and release metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const metadataPath = 'app/build/outputs/apk/release/output-metadata.json';
          const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          if (!Array.isArray(metadata.elements) || metadata.elements.length !== 1) {
            throw new Error('Expected exactly one release APK output.');
          }
          const element = metadata.elements[0];
          const versionName = String(element.versionName ?? '');
          const versionCode = Number(element.versionCode);
          if (!/^\d+\.\d+\.\d+$/.test(versionName) || !Number.isInteger(versionCode) || versionCode < 10) {
            throw new Error(`Invalid release metadata: ${versionName} / ${versionCode}`);
          }
          if (process.env.TAG_NAME !== `v${versionName}`) {
            throw new Error(`Tag ${process.env.TAG_NAME} does not match APK version v${versionName}.`);
          }
          const source = path.join('app/build/outputs/apk/release', element.outputFile);
          if (!fs.existsSync(source)) throw new Error(`Missing APK: ${source}`);
          const target = `FuckBaiduInput-v${versionName}.apk`;
          fs.copyFileSync(source, target);
          fs.writeFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${versionName}\nRELEASE_APK=${target}\n`, { flag: 'a' });
          NODE
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" | tee "$RUNNER_TEMP/apksigner.txt"
          EXPECTED_CERT_SHA256="7CA9B268208613247C63081F9AC7B7697062A63CF529DE74F0A8C80973FAFC56"
          tr -d ':' < "$RUNNER_TEMP/apksigner.txt" | tr '[:lower:]' '[:upper:]' | grep -Fq "$EXPECTED_CERT_SHA256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" "$RELEASE_APK" \
            --title "FuckBaiduInput v$RELEASE_VERSION" \
            --notes-file ".github/release-notes/v$RELEASE_VERSION.md" \
            --verify-tag

      - name: Upload formally signed artifact
        uses: actions/upload-artifact@v6
        with:
          name: FuckBaiduInput-${{ github.ref_name }}-signed
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/official.keystore"
