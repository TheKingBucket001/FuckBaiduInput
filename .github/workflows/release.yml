name: Verify and Sign APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify source and debug build
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          git diff --check
          ./gradlew :app:assembleDebug :app:lintDebug --stacktrace --console=plain

  signed-release:
    name: Build formally signed release APK
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore formal release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/official.keystore"
          test -s "$RUNNER_TEMP/official.keystore"
          chmod 600 "$RUNNER_TEMP/official.keystore"

      - name: Build formally signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/official.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:checkReleaseSigning :app:signRelease --stacktrace --console=plain

      - name: Verify formal release signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          EXPECTED_CERT_SHA256="7CA9B268208613247C63081F9AC7B7697062A63CF529DE74F0A8C80973FAFC56"
          tr -d ':' < "$RUNNER_TEMP/apksigner.txt" | tr '[:lower:]' '[:upper:]' | grep -Fq "$EXPECTED_CERT_SHA256"

      - name: Upload formally signed artifact
        uses: actions/upload-artifact@v6
        with:
          name: FuckBaiduInput-${{ github.ref_name }}-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/official.keystore"
